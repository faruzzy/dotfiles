#     ███       ▄▄▄▄███▄▄▄▄   ███    █▄  ▀████    ▐████▀
# ▀█████████▄ ▄██▀▀▀███▀▀▀██▄ ███    ███   ███▌   ████▀
#    ▀███▀▀██ ███   ███   ███ ███    ███    ███  ▐███
#     ███   ▀ ███   ███   ███ ███    ███    ▀███▄███▀
#     ███     ███   ███   ███ ███    ███    ████▀██▄
#     ███     ███   ███   ███ ███    ███   ▐███  ▀███
#     ███     ███   ███   ███ ███    ███  ▄███     ███▄
#    ▄████▀    ▀█   ███   █▀  ████████▀  ████       ███▄
#
# Hierarchy:
#  Server
#  ㄴSession
#    ㄴWindow
#      ㄴPane

# https://tmux.reconquest.io/
# 256-color terminal advertised to applications running inside tmux.
set -g default-terminal "tmux-256color"

# Add true color support
set -g terminal-overrides "linux*:AX@,*256col*:Tc,screen-256color:Ss=\\E[%p1%d q:Se=\\E[ q,xterm-256color:Ss=\\E[%p1%d q:Se=\\E[ q"
set -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title:cstyle,rxvt*:ignorefkeys"
# Ghostty: forward modified keys and OSC 8 hyperlinks (tmux strips links otherwise)
set -as terminal-features ",xterm-ghostty:extkeys:hyperlinks"

# Send keys like Shift+Enter and Ctrl+Enter as distinct CSI u sequences (Claude Code's newline,
# <S-CR> in Neovim) to every app, not only to apps that ask. Plain keys, Ctrl+letter and
# Alt+letter are unchanged; .zshrc binds the Enter variants so the shell still runs the line
set -g extended-keys always
set -g extended-keys-format csi-u

set -g set-clipboard on
set -g cursor-style blinking-block
set -s escape-time 0

# In order for Tmux to do its magic focus-events option has to be set to on.
set -g focus-events on

# -------------------------------------------------------------------
# Session options
# -------------------------------------------------------------------

set -g status-interval 5

# -------------------------------------------------------------------
# Session options
# -------------------------------------------------------------------

#Change bind key to ctrl-x
unbind-key c-b
set-option -g prefix c-x

# Index starts from 1
set-option -g base-index 1
setw -g pane-base-index 1   # make pane numbering consistent with windows

setw -g automatic-rename on # rename window to reflect current program
set -g automatic-rename-format '#{b:pane_current_path}'
set -g renumber-windows on  # renumber windows when a window is closed

# set -g set-titles on #set terminal title
# set -g set-titles-string '#h ❐ #S ● #I #W'

#History
set-option -g history-limit 102401

#Mouse
set-option -g mouse on
# Mouse mode keeps clicks from Ghostty, so its Cmd-click on links never fires: a click on an
# OSC 8 hyperlink opens it, any other click behaves as before
bind-key -n MouseDown1Pane if-shell -F '#{mouse_hyperlink}' \
  'run-shell -b "open #{q:mouse_hyperlink}"' \
  'select-pane -t = ; send-keys -M'

#vi-mode
set-window-option -g mode-keys vi
set-option -g status-keys vi

# Vi-style copy paste. Copies (y and mouse drags) go through bin/tmux-copy, which strips Claude
# Code's markers, trailing spaces and shared indentation before pbcopy
set -g copy-command 'tmux-copy'
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel
bind-key -Tcopy-mode-vi Escape send -X cancel
bind-key -Tcopy-mode-vi V send -X rectangle-toggle
# Mouse copies keep the selection and the scroll position (q or Escape leaves copy mode);
# double-click copies a word, triple-click a line
bind-key -Tcopy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind-key -Tcopy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-no-clear
bind-key -Tcopy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-no-clear

set-option -g default-shell /opt/homebrew/bin/zsh

# -------------------------------------------------------------------
# Key bindings
# -------------------------------------------------------------------
# prefix c
bind-key c new-window -c "#{pane_current_path}"

# prefix ctrl-x
bind-key c-x last-window

# prefix x
bind-key x send-prefix

# prefix |
bind-key \\ split-window -h -c "#{pane_current_path}"

# prefix -
bind-key - split-window -c "#{pane_current_path}"

# Moving windows
bind-key -r > swap-window -t :+
bind-key -r < swap-window -t :-

# Back and forth
bind-key bspace previous-window
bind-key space next-window
bind-key / next-layout # Overridden

bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Set window split
# Bind function keys.
bind -n F1 select-window -t 1
bind -n F2 select-window -t 2
bind -n F3 select-window -t 3
bind -n F4 select-window -t 4
bind -n F5 select-window -t 5
bind -n F6 select-window -t 6
bind -n F7 select-window -t 7
bind -n F8 select-window -t 8
bind -n F9 select-window -t 9
bind -n F10 select-window -t 0

# -------------------------------------------------------------------
# fzf integration
# -------------------------------------------------------------------

# Tmux completion
bind-key -n 'M-t' run "tmux split-window -p 40 'zsh -c \"source ~/.functions.zsh; tmux_words #{pane_id}\"'"

# fzf-locate (all)
bind-key -n 'M-`' run "tmux split-window -p 40 'zsh -c \"source ~/.functions.zsh; tmux_fzf_files #{pane_id}\"'"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'junegunn/tmux-fzf-maccy'
set -g allow-passthrough on

# tmux-resurrect: restore neovim sessions
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum: auto-save every 15 minutes, auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Window labels: keep Catppuccin's reload phase simple, then refine below.
set -g @catppuccin_window_text ' #{b:pane_current_path}'
set -g @catppuccin_window_current_text ' #{b:pane_current_path}'
set -g @catppuccin_window_number '#I:'
set -g @catppuccin_window_current_number '#I:'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -g status-position top
set -g status on
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-justify left
set -g status-left-length 0
set -g status-right-length 40
set -g status-left ''
# Rounded pills like lualine; the caps are \u escapes, which tmux expands only in double quotes.
# Each window format ends in its own gap: #{W:} in status-format ignores window-status-separator
set -g status-right "#[fg=#313244,bg=#1e1e2e]\ue0b6#[fg=#89b4fa,bg=#313244]%Y-%m-%d #[fg=#f5c2e7]%H:%M#[fg=#313244,bg=#1e1e2e]\ue0b4 "
set -g window-status-format "#[fg=#313244,bg=#1e1e2e]\ue0b6#[fg=#7f849c,bg=#313244]#I #[fg=#a6adc8]#{?#{==:#{pane_current_command},nvim},#{b:pane_current_path}/#{s| - Nvim||:pane_title},#{b:pane_current_path}}#F#[fg=#313244,bg=#1e1e2e]\ue0b4 "
set -g window-status-current-format "#[fg=#cba6f7,bg=#1e1e2e]\ue0b6#[fg=#1e1e2e,bg=#cba6f7,bold]#I #{?#{==:#{pane_current_command},nvim},#{b:pane_current_path}/#{s| - Nvim||:pane_title},#{b:pane_current_path}}#F#[fg=#cba6f7,bg=#1e1e2e,nobold]\ue0b4 "
set -g status-format[0] '#[align=left]#{W:#{E:window-status-format},#{E:window-status-current-format}}#[align=right]#{T:status-right}'

# Heavy separators between panes, plus a rule across the top of each pane (an empty header row).
# Only in windows with several panes; the hook re-checks whenever a split opens or closes.
set -g pane-border-lines heavy
set -g pane-border-status off
set -g pane-border-format ''
set-hook -g window-layout-changed[10] "if -F '#{==:#{window_panes},1}' 'set -w pane-border-status off' 'set -w pane-border-status top'"
