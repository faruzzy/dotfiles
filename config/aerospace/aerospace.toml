# AeroSpace window placement. This config is shared by two machines and setups.
#
# Home (three DELL U2715H monitors, laptop lid closed):
# Monitors are referenced by position (1 = left, 2 = center, 3 = right), not by
# name, because macOS numbers the identical Dells differently on each Mac
# (center is "DELL U2715H (3)" on the personal Mac but "(2)" on the work Mac).
#
# Work (built-in display + one wide monitor):
# - Built-in Retina Display
# - PHL 346B1C (Philips wide monitor)
# Position 1/2 assignments apply here as well (3 doesn't exist, so those
# workspaces stay wherever they are). Put 'built-in' first to pin one to the laptop.

config-version = 2
start-at-login = true

after-startup-command = [
    'exec-and-forget /bin/bash ~/.config/aerospace/sync-spotify-workspace.sh',
    'exec-and-forget /bin/bash ~/.config/aerospace/sync-messaging-workspace.sh',
    'exec-and-forget /bin/bash ~/.config/aerospace/sync-safari-workspace.sh',
    'exec-and-forget /bin/bash ~/.config/aerospace/sync-teams-call-window.sh',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = [
    'exec-and-forget /bin/bash ~/.config/aerospace/sync-spotify-workspace.sh',
    'exec-and-forget /bin/bash ~/.config/aerospace/sync-messaging-workspace.sh',
    'exec-and-forget /bin/bash ~/.config/aerospace/sync-safari-workspace.sh',
    'exec-and-forget /bin/bash ~/.config/aerospace/sync-teams-call-window.sh',
]
automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ['C', 'L', 'X', 'V', 'K', 'P', 'R', 'M', 'A', 'D', 'H', 'T', 'F', 'G', 'Y', 'S', 'B', 'W', 'N', 'O', 'E', 'Q']

[gaps]
inner.horizontal = 2
inner.vertical = 2
outer.left = 5
outer.bottom = 2
outer.top = 2
outer.right = 5

[workspace-to-monitor-force-assignment]
'C' = ['built-in', 1] # Canary, built-in display at work; left monitor at home (lid closed)
'L' = 1 # Claude, left monitor
'X' = 1 # Codex, left monitor
'V' = 1 # VS Code, left monitor
'K' = 1 # Anki, left monitor
'P' = 1 # Nord Sound Manager, left monitor
'R' = 1 # Audio MIDI Setup / Steinberg Download Assistant, left monitor
'A' = 1 # Safari, left monitor
'D' = ['built-in', 1] # Things, built-in display at work; left monitor at home (lid closed)
'H' = 1 # Dash, left monitor
'E' = ['built-in', 3] # Outlook, built-in display at work; right monitor at home (lid closed)
'Q' = ['built-in', 3] # Microsoft Teams, built-in display at work; right monitor at home (lid closed)
'T' = 2 # Ghostty / Terminal, center monitor
'F' = 2 # Firefox Developer Edition, center monitor
'G' = 2 # Logic Pro, center monitor
'Y' = 2 # Obsidian temporary center workspace
'B' = 3 # Brave, right monitor
'W' = 3 # Google Chrome, right monitor
'N' = 3 # Notes / documents, right monitor
'O' = 3 # Obsidian, right monitor

[mode.main.binding]
# Keep alt-tab free for AltTab.
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

cmd-left = ['layout floating', 'exec-and-forget /bin/bash ~/.config/aerospace/window-frame.sh left-half']
cmd-right = ['layout floating', 'exec-and-forget /bin/bash ~/.config/aerospace/window-frame.sh right-half']
ctrl-enter = ['layout floating', 'exec-and-forget /bin/bash ~/.config/aerospace/window-frame.sh maximize']
cmd-enter = ['layout floating', 'exec-and-forget /bin/bash ~/.config/aerospace/window-frame.sh center']
ctrl-cmd-right = 'exec-and-forget /bin/bash ~/.config/aerospace/move-focused-window.sh next'
ctrl-cmd-left = 'exec-and-forget /bin/bash ~/.config/aerospace/move-focused-window.sh prev'

alt-h = 'focus left'
alt-l = 'focus right'
ctrl-alt-j = 'focus down'
ctrl-alt-k = 'focus up'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-1 = 'workspace C'
alt-2 = 'workspace L'
alt-3 = 'workspace X'
alt-4 = 'workspace V'
alt-5 = 'workspace M'
alt-6 = 'workspace A'
alt-7 = 'workspace D'
alt-8 = 'workspace T'
alt-9 = 'workspace F'
alt-0 = 'workspace G'
alt-minus = 'workspace S'
alt-equal = 'workspace B'
alt-backslash = 'workspace W'
alt-quote = 'workspace N'
alt-period = 'workspace O'
alt-e = 'workspace E' # Outlook
alt-q = 'workspace Q' # Microsoft Teams

alt-shift-1 = ['move-node-to-workspace C', 'workspace C']
alt-shift-2 = ['move-node-to-workspace L', 'workspace L']
alt-shift-3 = ['move-node-to-workspace X', 'workspace X']
alt-shift-4 = ['move-node-to-workspace V', 'workspace V']
alt-shift-5 = ['move-node-to-workspace M', 'workspace M']
alt-shift-6 = ['move-node-to-workspace A', 'workspace A']
alt-shift-7 = ['move-node-to-workspace D', 'workspace D']
alt-shift-8 = ['move-node-to-workspace T', 'workspace T']
alt-shift-9 = ['move-node-to-workspace F', 'workspace F']
alt-shift-0 = ['move-node-to-workspace G', 'workspace G']
alt-shift-minus = ['move-node-to-workspace S', 'workspace S']
alt-shift-equal = ['move-node-to-workspace B', 'workspace B']
alt-shift-backslash = ['move-node-to-workspace W', 'workspace W']
alt-shift-quote = ['move-node-to-workspace N', 'workspace N']
alt-shift-period = ['move-node-to-workspace O', 'workspace O']
alt-shift-e = ['move-node-to-workspace E', 'workspace E']
alt-shift-q = ['move-node-to-workspace Q', 'workspace Q']

alt-s = 'focus-monitor left'
alt-g = 'focus-monitor right'
alt-shift-s = ['move-node-to-monitor left', 'focus-monitor left']
alt-shift-g = ['move-node-to-monitor right', 'focus-monitor right']

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# Catch-all: float typical dialog / popup / secondary windows across all apps.
# AeroSpace runs ONLY the first matching on-window-detected rule, so this must
# stay above app-specific rules below. The anchor at title start avoids false
# positives from document / note titles that merely contain these words.
# Expand this list when a new popup pattern slips through.
[[on-window-detected]]
if.window-title-regex-substring = '(?i)^(Settings|Preferences|About|Properties|Options|Export|Import|Save As|Print|Find|Replace|Get Info|Welcome|Community plugins)'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace T', 'exec-and-forget /bin/bash ~/.config/aerospace/sync-messaging-workspace.sh']

[[on-window-detected]]
if.app-id = 'com.apple.Terminal'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'org.alacritty'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-name-regex-substring = '^Ghostty$|^Terminal$|^Alacritty$'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.google.Chrome.canary'
run = 'move-node-to-workspace C'

[[on-window-detected]]
if.app-name-regex-substring = 'Chrome Canary'
run = 'move-node-to-workspace C'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace L'

[[on-window-detected]]
if.app-name-regex-substring = '^Claude$'
run = 'move-node-to-workspace L'

[[on-window-detected]]
if.app-id = 'com.openai.codex'
run = 'move-node-to-workspace X'

[[on-window-detected]]
if.app-name-regex-substring = '^Codex$'
run = 'move-node-to-workspace X'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace V'

[[on-window-detected]]
if.app-name-regex-substring = '^(Code|Visual Studio Code)$'
run = 'move-node-to-workspace V'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefoxdeveloperedition'
run = ['move-node-to-workspace F', 'fullscreen on']

[[on-window-detected]]
if.app-name-regex-substring = '^Firefox Developer Edition$'
run = ['move-node-to-workspace F', 'fullscreen on']

[[on-window-detected]]
if.app-id = 'com.apple.logic10'
run = [
    'move-node-to-workspace G',
    'exec-and-forget /bin/bash ~/.config/aerospace/sync-spotify-workspace.sh',
    'exec-and-forget /bin/bash ~/.config/aerospace/sync-safari-workspace.sh',
]

[[on-window-detected]]
if.app-name-regex-substring = '^Logic Pro$'
run = [
    'move-node-to-workspace G',
    'exec-and-forget /bin/bash ~/.config/aerospace/sync-spotify-workspace.sh',
    'exec-and-forget /bin/bash ~/.config/aerospace/sync-safari-workspace.sh',
]

[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = '^Calendar$'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Dictionary'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = '^Dictionary$'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.electron.dockerdesktop'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.docker.docker'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.hp.SmartMac'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = '^HP$'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'cc.ffitch.shottr'
run = ['layout floating', "move-node-to-monitor 2"]

[[on-window-detected]]
if.app-name-regex-substring = '^Shottr$'
run = ['layout floating', "move-node-to-monitor 2"]

[[on-window-detected]]
if.app-id = 'net.steinberg.elicenser.SteinbergDownloadAssistant'
run = ['move-node-to-workspace R', 'layout floating']

[[on-window-detected]]
if.app-id = 'net.steinberg.eLicenser.installer.SteinbergDownloadAssistant'
run = ['move-node-to-workspace R', 'layout floating']

[[on-window-detected]]
if.app-name-regex-substring = '^Steinberg Download Assistant'
run = ['move-node-to-workspace R', 'layout floating']

[[on-window-detected]]
if.app-id = 'com.steinberg.SteinbergActivationManager'
run = ['move-node-to-workspace R', 'layout floating tiling']

[[on-window-detected]]
if.app-id = 'com.apple.audio.AudioMIDISetup'
run = 'move-node-to-workspace R'

[[on-window-detected]]
if.app-name-regex-substring = '^Audio MIDI Setup$'
run = 'move-node-to-workspace R'

[[on-window-detected]]
if.app-id = 'com.clavia.NordSoundManager'
run = ['move-node-to-workspace P', 'fullscreen on']

[[on-window-detected]]
if.app-name-regex-substring = '^Nord Sound Manager$'
run = ['move-node-to-workspace P', 'fullscreen on']

[[on-window-detected]]
if.app-id = 'net.ankiweb.anki'
run = 'move-node-to-workspace K'

[[on-window-detected]]
if.app-name-regex-substring = '^Anki$'
run = 'move-node-to-workspace K'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = ['move-node-to-workspace S', 'exec-and-forget /bin/bash ~/.config/aerospace/sync-spotify-workspace.sh']

[[on-window-detected]]
if.app-id = 'com.readdle.smartemail-Mac'
run = 'move-node-to-workspace N'

[[on-window-detected]]
if.app-name-regex-substring = '^Spark$'
run = 'move-node-to-workspace N'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = [
    'move-node-to-workspace A',
    'fullscreen on',
    'exec-and-forget /bin/bash ~/.config/aerospace/sync-safari-workspace.sh',
]

[[on-window-detected]]
if.app-id = 'com.culturedcode.ThingsMac'
run = 'move-node-to-workspace D'

[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = 'move-node-to-workspace E'

# Teams call/meeting windows are titled after the meeting or person, while the
# main window is "<Section> | <name>". Float calls over Ghostty in T.
# sync-teams-call-window.sh catches call windows whose title is set after creation.
[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
if.window-title-regex-substring = '^(?!Microsoft Teams$)[^|]+$'
run = ['layout floating', 'move-node-to-workspace T']

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = ['layout tiling', 'move-node-to-workspace Q', 'exec-and-forget /bin/bash ~/.config/aerospace/sync-teams-call-window.sh']

[[on-window-detected]]
if.app-id = 'com.kapeli.dashdoc'
run = 'move-node-to-workspace H'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace O'

[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-name-regex-substring = 'Brave'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace W'

[[on-window-detected]]
if.app-name-regex-substring = '^Google Chrome$'
run = 'move-node-to-workspace W'

[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = ['move-node-to-workspace O', 'move right']

[[on-window-detected]]
if.app-id = 'com.adobe.Acrobat.Pro'
run = ['move-node-to-workspace N', 'move left']

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace M'

[[on-window-detected]]
if.app-name-regex-substring = '^Slack$'
run = 'move-node-to-workspace M'

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = ['move-node-to-workspace M', 'exec-and-forget /bin/bash ~/.config/aerospace/sync-messaging-workspace.sh']

[[on-window-detected]]
if.app-name-regex-substring = 'WhatsApp'
run = ['move-node-to-workspace M', 'exec-and-forget /bin/bash ~/.config/aerospace/sync-messaging-workspace.sh']

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = ['move-node-to-workspace M', 'exec-and-forget /bin/bash ~/.config/aerospace/sync-messaging-workspace.sh']

[[on-window-detected]]
if.app-name-regex-substring = '^Messages$'
run = ['move-node-to-workspace M', 'exec-and-forget /bin/bash ~/.config/aerospace/sync-messaging-workspace.sh']

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systemsettings'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'
